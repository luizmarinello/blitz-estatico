# Publica o front no GitHub Pages a cada push na main do repositório blitz-estatico (RNF05: Git + CI; RNF04: HTTPS do Pages).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # O Pages não tem fallback de SPA: um endereço como /blitz-estatico/cadastro cairia no 404.
      # ponytail: 404.html = index.html resolve, mas a página volta com status 404; trocar de hospedagem se isso importar.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
